services:
  # Web Service: Next.js App Router (Fullstack News Portal)
  - type: web
    name: bangladeshi-news-portal
    runtime: node
    plan: starter
    region: singapore # Closest region to Bangladesh for low latency
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set your Neon PostgreSQL Connection String (pooled)
      - key: BETTER_AUTH_SECRET
        generateValue: true # Render automatically generates a 32-character secret
      - key: BETTER_AUTH_URL
        sync: false # e.g. https://bangladeshi-news-portal.onrender.com
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_NAME
        value: "Yes News 24"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # e.g. https://bangladeshi-news-portal.onrender.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false # e.g. https://media.yournewspaper.com

  # Cron Job: Publish Scheduled Editorial Articles (Every 5 mins)
  - type: cron
    name: news-portal-publish-scheduled
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: ""
    startCommand: "curl -s -f -H \"Authorization: Bearer $CRON_SECRET\" \"$NEXT_PUBLIC_SITE_URL/api/cron/publish-scheduled\""
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: bangladeshi-news-portal
          envVarKey: CRON_SECRET
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: bangladeshi-news-portal
          envVarKey: NEXT_PUBLIC_SITE_URL
